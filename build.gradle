plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'


java {

    toolchain {

        languageVersion = JavaLanguageVersion.of(17)

    }

}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.38.0'
    testImplementation 'org.testng:testng:7.11.0'
    testImplementation 'org.slf4j:slf4j-api:2.0.17'
    testRuntimeOnly  'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.2'
    testRuntimeOnly  'org.apache.logging.log4j:log4j-core:2.25.2'
    testRuntimeOnly  'org.apache.logging.log4j:log4j-api:2.25.2'
    testImplementation 'commons-io:commons-io:2.20.0'
    testImplementation 'io.qameta.allure:allure-testng:2.30.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:6.3.2'
}

test {
    useTestNG() {
        suites 'src/test/resources/testng.xml'
    }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

allure {
    report {
        version = '2.30.0'
    }
}
tasks.named('allureReport') { dependsOn tasks.named('test') }
tasks.named('allureServe') { dependsOn tasks.named('test') }